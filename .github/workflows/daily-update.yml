# Industry Scorer: the cheap daily update of every analyzed sector.
#
# Every day after the US close, for every sector whose full analysis is in the "exports" branch:
#   1. code refreshes every number (prices, returns, estimates, positioning, macro values, news, the SEC's 8-K
#      filings): no Claude;
#   2. code compares today with the last update and flags hard triggers (a big move, a top company reporting or
#      filing results, a midday market alarm, ...);
#   3. the quick model (Haiku) reads the day and names every section it touches; when the industry moved far but Haiku
#      saw nothing, Sonnet gives a second opinion;
#   4. the sections worth the most are rewritten by the same analysts as the full run, within the day's share of the
#      monthly budget (a big day borrows up to three days' share);
#   5. the strategist (Opus) brings the WHOLE analysis up to date: thesis, drivers, debates, scenarios, the opportunity,
#      the investor verdicts and the 1M-12M calls, changing only what the day changes;
#   6. the drift guard orders a full rewrite from scratch when the industry has moved 2+ normal moves since the last
#      one or when the strategist says it would now write the story differently (and, as upkeep, after 6 updates to the
#      core story).
# The updated sector goes back to the exports branch, so "Pull from GitHub" in Industry Scorer gets it.
# The full analysis is still the weekly "Sector run" (list the sectors in runner/weekly-sectors.txt).
#
# Sectors run side by side (DAILY_PARALLEL at once, default 4, started a minute apart so data pulls don't all hit
# FMP together); inside each sector, several industries are refreshed at once.
name: Daily update
run-name: ${{ inputs.backfill && 'History pass (Times like this, calls re-graded)' || 'Daily update' }}

on:
  workflow_dispatch:
    inputs:
      sector:
        description: "Sectors to update, separated by commas (empty = every sector in the exports branch)"
        required: false
        default: ""
      budget:
        description: "Most to spend on Claude per sector today, in US dollars (empty = no limit)"
        required: false
        default: ""
      shock:
        description: "Set by the midday market alarm: what moved (makes today a big day)"
        required: false
        default: ""
      backfill:
        description: "The history pass only: add Times like this to industries that lack it (runs even while daily updates are paused)"
        type: boolean
        default: false
  schedule:
    - cron: "37 21 * * *" # every day at 21:37 UTC (after the US close on weekdays; weekends catch the news)

permissions:
  contents: write # to save the updated sectors in the exports branch
  actions: write # to refresh the status page's data as it goes

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      sectors: ${{ steps.p.outputs.sectors }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: p
        env:
          ONLY: ${{ inputs.sector }}
          # The most the daily updates may spend on Claude in a month, all sectors together (about $500 a month with
          # GitHub's minutes). Each sector gets its share by number of industries; each day spends its share of what's left.
          MONTH_BUDGET: ${{ vars.DAILY_MONTHLY_BUDGET_USD || '455' }}
          BACKFILL: ${{ inputs.backfill && '1' || '' }}
        run: |
          # Paused from the runs page ("Daily updates: off", kept in the status branch's control.json): nothing runs
          # except the history pass.
          if [ "$BACKFILL" != "1" ] && git fetch -q origin status 2>/dev/null && git show FETCH_HEAD:control.json 2>/dev/null | grep -q '"daily_paused": *true'; then
            echo "Daily updates are paused (turn them on from the runs page)." | tee -a "$GITHUB_STEP_SUMMARY"; echo "sectors=[]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Every sector in the exports branch with at least one finished industry (a sector still adding industries,
          # or stopped part-way, updates the industries it has finished).
          mkdir -p exp/runs
          if git fetch -q origin exports 2>/dev/null; then for f in $(git ls-tree --name-only FETCH_HEAD runs/); do git show "FETCH_HEAD:$f" > "exp/$f"; done; fi
          echo "sectors=$(node runner/daily-plan.mjs exp)" >> "$GITHUB_OUTPUT"
      - name: Tell the status page an update has started
        if: steps.p.outputs.sectors != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run queue.yml --ref "${{ github.ref_name }}" -f action=status || true

  update:
    needs: plan
    if: needs.plan.outputs.sectors != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJson(needs.plan.outputs.sectors) }}
    concurrency:
      group: sector-${{ matrix.sector }}
      cancel-in-progress: false
    env:
      SECTOR: ${{ matrix.sector }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: slug
        run: echo "slug=$(echo "$SECTOR" | tr '[:upper:]' '[:lower:]' | sed -e 's/&/and/g' -e 's/[^a-z0-9]\+/-/g' -e 's/^-//' -e 's/-$//')" >> "$GITHUB_OUTPUT"
      - name: Stagger the start
        if: strategy.job-index > 0
        env:
          INDEX: ${{ strategy.job-index }}
        run: sleep $(( (INDEX % 6) * 60 ))
      - name: Get the sector's last analysis
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          mkdir -p base
          git fetch -q origin exports && git show "FETCH_HEAD:runs/$SLUG.json.gz" > base/checkpoint.json.gz
      - name: Install
        working-directory: runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: runner
        run: npx playwright install --with-deps chromium
      - name: Daily update of ${{ matrix.sector }}
        working-directory: runner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FMP_MCP_URL: ${{ secrets.FMP_MCP_URL }}
          EODHD_MCP_URL: ${{ secrets.EODHD_MCP_URL }}
          FMP_MCP_HEADERS: ${{ secrets.FMP_MCP_HEADERS }}
          EODHD_MCP_HEADERS: ${{ secrets.EODHD_MCP_HEADERS }}
          JOB_FMP_GAP_MS: ${{ vars.FMP_GAP_MS || '230' }}
          JOB_DAILY_INDUSTRIES: ${{ vars.DAILY_INDUSTRIES || '8' }}
          CLAUDE_MODEL_QUICK: ${{ vars.CLAUDE_MODEL_QUICK || 'claude-haiku-4-5-20251001' }}
          CLAUDE_MODEL_DEFAULT: ${{ vars.CLAUDE_MODEL_DAILY || 'claude-sonnet-5-5' }}
          # Bringing the whole analysis up to date, and rewriting it from scratch: the best model, where it matters most.
          CLAUDE_MODEL_LEAD: ${{ vars.CLAUDE_MODEL_DAILY_LEAD || 'claude-opus-5-5' }}
          JOB_MONTH_BUDGET: ${{ inputs.backfill && '' || matrix.budget }}
          JOB_SHOCK: ${{ inputs.shock }}
          JOB_BACKFILL: ${{ inputs.backfill && '1' || '' }}
          # Sections rewritten for the news (set the variable to claude-opus-5-5 for full quality, about twice the cost).
          CLAUDE_MODEL_COMPLEX: ${{ vars.CLAUDE_MODEL_DAILY_COMPLEX || 'claude-sonnet-5-5' }}
          CLAUDE_MODE: batch
          CLAUDE_STRAGGLER_MIN: "30"
          CLAUDE_BUDGET_USD: ${{ inputs.budget || vars.DAILY_BUDGET_USD || matrix.safety }}
        run: |
          set +e
          node run.mjs --daily --sector "$SECTOR" --resume ../base/checkpoint.json.gz --out ../out --deadline-min 340
          code=$?
          # Out of time (75): what finished is in the checkpoint; keep it.
          if [ $code -eq 75 ]; then exit 0; fi
          exit $code
      - name: Keep the updated sector in the exports branch
        # Saved even when the run stopped early: every industry it finished is complete in the checkpoint.
        if: always() && hashFiles('out/checkpoint.json.gz') != ''
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            rm -rf ex-wt; git fetch -q origin exports && git worktree add -q ex-wt FETCH_HEAD
            mkdir -p ex-wt/runs && cp out/checkpoint.json.gz "ex-wt/runs/$SLUG.json.gz"
            (cd ex-wt && git add runs && { git diff --cached --quiet || git commit -qm "Daily update: $SECTOR (run ${{ github.run_id }})"; } && git push -q origin HEAD:refs/heads/exports) && break
            git worktree remove --force ex-wt; sleep $((RANDOM % 20 + 5))
          done
      - name: Tell the status page this sector is done
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run queue.yml --ref "${{ github.ref_name }}" -f action=status || true
