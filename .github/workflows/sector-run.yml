# Industry Scorer: analyze every industry in a sector on your own API keys.
#
# Easiest: Actions → "Run <Sector>" (one workflow per sector) → Run workflow.
# Or here: Actions → "Sector run" → Run workflow → type a sector, several separated by commas, or "all".
# Shared library: each run starts from the facts earlier sectors researched (the news wire, world situations,
# countries, regulator instruments; kept in the "library" branch), reuses what applies, and adds what it
# researched. Run sectors one after another to get the most reuse.
# A run longer than one GitHub session (about 5.5 hours) saves a checkpoint and continues in a new run by itself.
# Results: the latest checkpoint of every sector is kept in the "exports" branch (runs/<sector>.json.gz) and as
# the run's "checkpoint-..." artifact; import it in Industry Scorer.
#
# Secrets (Settings → Secrets and variables → Actions → New repository secret):
#   ANTHROPIC_API_KEY   your Anthropic API key (console.anthropic.com)
#   FMP_MCP_URL         the URL of your FMP MCP server (the one your claude.ai FMP connector uses)
#   EODHD_MCP_URL       the URL of your EODHD MCP server (optional but recommended)
#   FMP_MCP_HEADERS / EODHD_MCP_HEADERS   only if the server needs a header, as JSON: {"Authorization":"Bearer ..."}
name: Sector run
run-name: Sector run · ${{ inputs.sector || 'weekly list' }}

on:
  workflow_dispatch:
    inputs:
      sector:
        description: "Sector to analyze (e.g. Consumer Defensive), several separated by commas, or all (empty = the sectors in runner/weekly-sectors.txt)"
        required: false
        default: ""
      fresh:
        description: "Start over instead of continuing an unfinished run"
        type: boolean
        default: false
      speed:
        description: "cheap = half-price batches (slower, often several hours); quick = standard price (about 1-2 hours, roughly twice the cost)"
        type: choice
        options: [cheap, quick]
        default: cheap
      budget:
        description: "Most to spend on Claude per sector in this run, in US dollars. It stops and saves before going over; continue later with continue_from."
        required: true
        default: "150"
      redo_gaps:
        description: "Only rewrite the lead strategists whose 1M-12M calls left items out (a finished sector; nothing else is redone)"
        type: boolean
        default: false
      add_new:
        description: "Only analyze the industries a finished sector doesn't have yet (e.g. the small ones it used to leave out); everything else is kept"
        type: boolean
        default: false
      model:
        description: "auto = Opus 5.5 for the lead strategist (the most important step), Sonnet 5.5 for the analysts; opus = Opus everywhere; sonnet = Sonnet everywhere"
        type: choice
        options: [auto, opus, sonnet]
        default: auto
      continue_from:
        description: "(set automatically) the run whose checkpoint to continue from"
        required: false
        default: ""
  workflow_call:
    inputs:
      sector: { type: string, required: true }
      fresh: { type: boolean, default: false }
      speed: { type: string, default: cheap }
      budget: { type: string, default: "150" }
      continue_from: { type: string, default: "" }
      redo_gaps: { type: boolean, default: false }
      add_new: { type: boolean, default: false }
      model: { type: string, default: auto }
  schedule:
    - cron: "17 9 * * 6" # every Saturday at 09:17 UTC: the full analysis (the "Daily update" workflow keeps it current on weekdays)

permissions:
  contents: write # to save the shared library and the latest results in their branches
  actions: write # to start the continuation run and read the previous run's checkpoint

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      sectors: ${{ steps.p.outputs.sectors }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          SECTOR: ${{ inputs.sector }}
        run: |
          list() { (grep -v '^[[:space:]]*#' "$1" || true) | sed '/^[[:space:]]*$/d' | jq -R . | jq -cs .; }
          if [ "$(echo "$SECTOR" | tr '[:upper:]' '[:lower:]' | xargs)" = "all" ]; then
            echo "sectors=$(list runner/all-sectors.txt)" >> "$GITHUB_OUTPUT"
          elif [ -n "$SECTOR" ]; then
            # one sector, or several separated by commas: "Energy, Utilities"
            echo "sectors=$(echo "$SECTOR" | tr ',' '\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          else
            echo "sectors=$(list runner/weekly-sectors.txt)" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: plan
    if: needs.plan.outputs.sectors != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 11 # every sector at once (starts staggered below; the job waits out FMP rate limits)
      matrix:
        sector: ${{ fromJson(needs.plan.outputs.sectors) }}
    concurrency:
      group: sector-${{ matrix.sector }}
      cancel-in-progress: false
    env:
      SECTOR: ${{ matrix.sector }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: slug
        run: echo "slug=$(echo "$SECTOR" | tr '[:upper:]' '[:lower:]' | sed -e 's/&/and/g' -e 's/[^a-z0-9]\+/-/g' -e 's/^-//' -e 's/-$//')" >> "$GITHUB_OUTPUT"
      - name: Stagger the start (several sectors at once)
        if: strategy.job-total > 1 && strategy.job-index > 0 && inputs.continue_from == ''
        env:
          WAIT_MIN: ${{ vars.STAGGER_MIN || '6' }}
          INDEX: ${{ strategy.job-index }}
        run: |
          echo "Starting $((INDEX * WAIT_MIN)) minutes after the first sector, so data pulls don't all hit FMP at once."
          echo "STAGGERED_MIN=$((INDEX * WAIT_MIN))" >> "$GITHUB_ENV"
          sleep $((INDEX * WAIT_MIN * 60))
      - name: Install
        working-directory: runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: runner
        run: npx playwright install --with-deps chromium
      - name: Get the checkpoint to continue from
        if: inputs.continue_from != ''
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-${{ steps.slug.outputs.slug }}
          run-id: ${{ inputs.continue_from }}
          github-token: ${{ github.token }}
          path: resume
      - name: Pick up this sector's unfinished run, if there is one
        if: inputs.continue_from == '' && !inputs.fresh
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
          REDO_GAPS: ${{ inputs.redo_gaps }}
          ADD_NEW: ${{ inputs.add_new }}
        run: |
          if git fetch -q origin exports 2>/dev/null && git show "FETCH_HEAD:runs/$SLUG.json.gz" > last.json.gz 2>/dev/null; then
            if [ "$REDO_GAPS" = "true" ] || [ "$ADD_NEW" = "true" ] || node -e 'const j=JSON.parse(require("zlib").gunzipSync(require("fs").readFileSync("last.json.gz")));process.exit(j.finished?1:0)'; then
              mkdir -p resume && mv last.json.gz resume/checkpoint.json.gz && echo "Continuing the unfinished $SECTOR run (only what's left is done)."
            else echo "The last $SECTOR run finished; starting a new one."; fi
          else echo "No earlier $SECTOR run."; fi
          rm -f last.json.gz
      - name: Get the shared library (what earlier sectors researched)
        run: |
          mkdir -p library
          if git fetch -q origin library 2>/dev/null; then git show FETCH_HEAD:library.json.gz > library/library.json.gz && echo "Library found." || rm -f library/library.json.gz; else echo "No library yet: this sector runs as the first one."; fi
      - name: Analyze ${{ matrix.sector }}
        id: run
        working-directory: runner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FMP_MCP_URL: ${{ secrets.FMP_MCP_URL }}
          EODHD_MCP_URL: ${{ secrets.EODHD_MCP_URL }}
          FMP_MCP_HEADERS: ${{ secrets.FMP_MCP_HEADERS }}
          EODHD_MCP_HEADERS: ${{ secrets.EODHD_MCP_HEADERS }}
          FRESH: ${{ inputs.fresh }}
          REDO_GAPS: ${{ inputs.redo_gaps }}
          ADD_NEW: ${{ inputs.add_new }}
          # auto (the default, and the weekly run): the lead strategist (synthesis, scenarios, the 1M-12M calls, the red
          # team, the investor verdicts) on Opus 5.5, the most important work; every analyst on Sonnet 5.5.
          CLAUDE_MODEL_COMPLEX: ${{ inputs.model == 'opus' && 'claude-opus-5-5' || 'claude-sonnet-5-5' }}
          CLAUDE_MODEL_LEAD: ${{ inputs.model == 'sonnet' && 'claude-sonnet-5-5' || 'claude-opus-5-5' }}
          JOB_FMP_GAP_MS: ${{ vars.FMP_GAP_MS || '230' }}
          CLAUDE_MODE: ${{ inputs.speed == 'quick' && 'direct' || 'batch' }}
          CLAUDE_STRAGGLER_MIN: ${{ vars.STRAGGLER_MIN || '0' }}
          CLAUDE_BUDGET_USD: ${{ inputs.budget || vars.BUDGET_USD || '150' }}
          CLAUDE_DIRECT_CONCURRENCY: ${{ vars.DIRECT_CONCURRENCY || '16' }}
          JOB_INDUSTRIES: ${{ vars.JOB_INDUSTRIES || '10' }}
          JOB_POOL: ${{ vars.JOB_POOL || '8' }}
          JOB_BODIES: ${{ vars.JOB_BODIES || '12' }}
        run: |
          set +e
          # This GitHub session ends 6 hours after it began (including any staggered start): stop in time to save.
          args=(--sector "$SECTOR" --out ../out --deadline-min $((320 - ${STAGGERED_MIN:-0})))
          [ -f ../resume/checkpoint.json.gz ] && args+=(--resume ../resume/checkpoint.json.gz)
          [ -f ../library/library.json.gz ] && args+=(--library ../library/library.json.gz)
          [ "$FRESH" = "true" ] && [ ! -f ../resume/checkpoint.json.gz ] && args+=(--fresh)
          node run.mjs "${args[@]}"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ $code -ne 0 ] && [ $code -ne 75 ]; then exit $code; fi
      - name: Save results
        if: always() && hashFiles('out/results-*.json.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ steps.slug.outputs.slug }}-${{ github.run_id }}
          path: out/results-*.json.gz
          retention-days: 30
          compression-level: 0
      - name: Save checkpoint
        if: always() && hashFiles('out/checkpoint.json.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-${{ steps.slug.outputs.slug }}
          path: out/checkpoint.json.gz
          retention-days: 7
          compression-level: 0
      - name: Add what this sector researched to the shared library
        if: always() && hashFiles('out/library.json.gz') != ''
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          # Other sectors may save at the same time: merge with the latest and retry.
          for i in 1 2 3 4 5 6; do
            rm -rf lib-wt; git fetch -q origin library 2>/dev/null && git worktree add -q lib-wt FETCH_HEAD 2>/dev/null || { git worktree add -q --detach lib-wt HEAD && (cd lib-wt && git checkout -q --orphan tmp && git rm -rqf .); }
            node runner/lib/libmerge.mjs lib-wt/library.json.gz lib-wt/library.json.gz out/library.json.gz
            (cd lib-wt && git add library.json.gz && { git diff --cached --quiet || git commit -qm "Library: $SECTOR (run ${{ github.run_id }})"; } && git push -q origin HEAD:refs/heads/library) && break
            git worktree remove --force lib-wt; sleep $((RANDOM % 20 + 5))
          done
      - name: Keep the latest results in the exports branch
        if: always() && hashFiles('out/checkpoint.json.gz') != ''
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            rm -rf ex-wt; git fetch -q origin exports 2>/dev/null && git worktree add -q ex-wt FETCH_HEAD 2>/dev/null || { git worktree add -q --detach ex-wt HEAD && (cd ex-wt && git checkout -q --orphan tmp && git rm -rqf .); }
            mkdir -p ex-wt/runs && cp out/checkpoint.json.gz "ex-wt/runs/$SLUG.json.gz"
            (cd ex-wt && git add runs && { git diff --cached --quiet || git commit -qm "Latest $SECTOR (run ${{ github.run_id }})"; } && git push -q origin HEAD:refs/heads/exports) && break
            git worktree remove --force ex-wt; sleep $((RANDOM % 20 + 5))
          done
      - name: Continue in a new run
        if: steps.run.outputs.code == '75'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sector-run.yml --ref "$GITHUB_REF_NAME" -f sector="$SECTOR" -f continue_from="${{ github.run_id }}" -f speed="${{ inputs.speed || 'cheap' }}" -f model="${{ inputs.model || 'auto' }}" -f budget="${{ steps.run.outputs.budget_left || inputs.budget || '150' }}"
