# One click: Actions → "Run Industrials" → Run workflow. Uses the shared library from earlier sectors.
name: Run Industrials

on:
  workflow_dispatch:
    inputs:
      speed:
        description: "cheap = half-price batches (slower, often several hours); quick = standard price (about 1-2 hours, roughly twice the cost)"
        type: choice
        options: [cheap, quick]
        default: cheap
      budget:
        description: "Most to spend on Claude in this run, in US dollars (it stops and saves before going over)"
        required: true
        default: "150"
      fresh:
        description: "Start over instead of continuing an unfinished run"
        type: boolean
        default: false
      redo_gaps:
        description: "Only rewrite the lead strategists whose 1M-12M calls left items out (for a finished sector)"
        type: boolean
        default: false
      add_new:
        description: "Only analyze the industries this sector doesn't have yet (the small ones it used to leave out); everything else is kept"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  sector:
    uses: ./.github/workflows/sector-run.yml
    with:
      sector: "Industrials"
      speed: ${{ inputs.speed }}
      budget: ${{ inputs.budget }}
      fresh: ${{ inputs.fresh }}
      redo_gaps: ${{ inputs.redo_gaps }}
      add_new: ${{ inputs.add_new }}
    secrets: inherit
